server {
    listen 80;
    server_name sang.tanmyco.cloud localhost;

    # Cho phép certbot truy cập để gia hạn sau này (renew SSL)
    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sang.tanmyco.cloud localhost;

    ssl_certificate /etc/letsencrypt/live/sang.tanmyco.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sang.tanmyco.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://webapp:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }
}
