name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push WebApp
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lucidtech-webapp:latest

      - name: Build and Push Nginx
        uses: docker/build-push-action@v4
        with:
          context: ./Deployment/nginx
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lucidtech-nginx:latest

  deploy:
    name: Deploy to Server
    needs: build_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH to Ubuntu Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Đi tới thư mục chứa code
            cd /home/azureuser/Deployment
            
            # 2. Định nghĩa Registry nếu cần
            export DOCKER_REGISTRY=${{ secrets.DOCKER_USERNAME }}
            
            # 3. Kéo image mới và khởi động lại
            chmod +x manage.sh
            ./manage.sh deploy
